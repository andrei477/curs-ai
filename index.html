<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Curs AI pentru Rareș — după Claude Academy</title>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#1f1d1a; --muted:#6b665e; --line:#e7e1d6;
    --accent:#d9774b; --accent-soft:#fbe9df; --ok:#2f8f5b; --ok-soft:#e3f4ea; --bad:#c0453a; --bad-soft:#fbe4e1;
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;-webkit-text-size-adjust:100%}
  html{touch-action:pan-y}
  img,iframe,video,table{max-width:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  header{position:sticky;position:-webkit-sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px}
  header h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
  .bar{flex:1 1 40px;min-width:40px;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent);width:0;transition:width .4s}
  .pct{font-size:14px;color:var(--muted);min-width:42px;text-align:right}
  .menu-btn{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:15px;cursor:pointer}
  .wrap{display:flex;align-items:flex-start;max-width:1100px;margin:0 auto}
  nav{width:280px;flex-shrink:0;padding:20px 12px;position:sticky;position:-webkit-sticky;top:var(--hdr,55px);align-self:flex-start;height:calc(100vh - var(--hdr,55px));height:calc(100dvh - var(--hdr,55px));overflow:auto;overscroll-behavior:contain}
  nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:15px;cursor:pointer;color:var(--ink)}
  nav button:hover{background:var(--card)}
  nav button.active{background:var(--accent-soft)}
  nav .dot{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--card)}
  nav button.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  nav small{display:block;color:var(--muted);font-size:12px}
  main{flex:1;min-width:0;overflow-wrap:anywhere;padding:28px 24px 80px;max-width:760px}
  .kicker{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  h2{font-size:30px;line-height:1.2;margin:6px 0 4px}
  .meta{color:var(--muted);font-size:14px;margin-bottom:22px}
  h3{font-size:19px;margin:28px 0 8px}
  p,li{font-size:16.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:18px 0}
  .try{border-left:5px solid var(--accent)}
  .try .label{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:6px}
  .prompt{background:#f4efe7;border-radius:10px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;white-space:pre-wrap;margin:8px 0}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.95)}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .compare .card{margin:0}
  .bad-t{color:var(--bad);font-weight:700}.good-t{color:var(--ok);font-weight:700}
  .quiz .q{margin:16px 0}
  .quiz .q b{display:block;margin-bottom:8px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15.5px;cursor:pointer}
  .opt:hover{border-color:var(--accent)}
  .opt.right{background:var(--ok-soft);border-color:var(--ok)}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
  .opt:disabled{opacity:.55;cursor:not-allowed}
  .opt.right:disabled,.opt.right{opacity:1}
  .fb{font-size:14.5px;margin-top:4px}
  .builder label{display:block;font-weight:600;font-size:14.5px;margin:10px 0 4px}
  .builder input,.builder select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;background:#fff}
  .footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
  .done-banner{background:var(--ok-soft);border:1px solid var(--ok);color:#1f5e3c;border-radius:12px;padding:12px 16px;margin:18px 0;font-weight:600}
  .diploma{text-align:center;border:3px double var(--accent);border-radius:18px;padding:36px 24px;background:var(--card)}
  .diploma .big{font-size:44px}
  .diploma h2{font-size:32px}
  .diploma input{font-size:20px;text-align:center;border:0;border-bottom:2px solid var(--line);padding:6px;width:min(320px,90%);font-family:inherit;background:transparent}
  .tip{font-size:14.5px;color:var(--muted)}
  .pin{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;margin-top:8px;background:#fff}
  .paid{background:#fff6e0;border:1px solid #e8c66a;border-radius:12px;padding:10px 14px;margin:14px 0;font-size:14.5px}
  .chal .steps{margin:6px 0 10px;padding-left:20px}
  .chal .steps li{margin:4px 0;font-size:15.5px}
  .acct-box{margin:16px 12px 4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;overflow-wrap:anywhere}
  nav button.locked{opacity:.5}
  .next{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 20px;font-size:15px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .next .here{color:var(--muted);font-size:13.5px}
  .road .rs{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
  .road .rs:last-child{border:0}
  .road .rn{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
  .road .lock .rn{background:var(--line)}
  .earn{margin:16px 12px 4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14.5px}
  .lvl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:14px 12px 4px}
  .lvl:first-child{margin-top:0}
  .play-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .play textarea{width:100%;height:380px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#1f1d1a;color:#f4efe7;resize:vertical}
  .play iframe{width:100%;height:380px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:16px;cursor:pointer}
  .chk input{width:18px;height:18px;margin-top:4px;accent-color:var(--ok)}
  code{background:#f4efe7;padding:1px 5px;border-radius:5px}
  @media (max-width:820px){.play-grid{grid-template-columns:1fr}.play textarea,.play iframe{height:260px}}
  .ord{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .ord-n{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;font-size:13px}
  .ord-t{flex:1;font-size:15.5px}
  .ord-b{display:flex;gap:4px}
  .btn.sm{padding:4px 10px;font-size:14px}
  .btn:disabled{opacity:.35;cursor:default}
  @media (max-width:820px){
    .menu-btn{display:block}
    nav{position:fixed;left:0;top:var(--hdr,55px);bottom:0;height:auto;background:var(--bg);z-index:4;transform:translateX(-100%);transition:transform .25s;border-right:1px solid var(--line);width:290px}
    nav.open{transform:none}
    main{padding:22px 16px 80px}
    h2{font-size:25px}
    .compare{grid-template-columns:1fr}
    header{position:fixed;left:0;right:0;top:0}
    body{padding-top:var(--hdr,54px)}
    header h1{font-size:14.5px}
    header{padding:10px 12px;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
    .pct{min-width:34px;font-size:13px}
    input,select,textarea,.pin{font-size:16px !important}
    .compare,.play-grid{grid-template-columns:minmax(0,1fr)}
    .prompt{word-break:break-word}
  }
  @media print{header,nav,.footer-nav,.btns{display:none}main{max-width:none}}
</style>
</head>
<body>
<header>
  <button class="menu-btn" onclick="toggleMenu()" aria-label="Meniu">☰</button>
  <h1>🚀 Curs AI · după Claude Academy</h1>
  <div class="bar"><div id="bar"></div></div>
  <div class="pct" id="pct">0%</div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
const PARENT="Andrei";
const CLAUDE = "https://claude.ai/new";
const ACADEMY = "https://academy.claude.com/products/claude";
const AC = p => "https://academy.claude.com/courses/" + p;
const PAID_NOTE = "💳 Unele exerciții practice cer un plan plătit (Pro sau mai mare), credit API sau un cont de cloud. Poți citi lecția și da quiz-ul oricum. Exercițiile plătite nu sunt obligatorii.";

/* =================== NIVELUL 1 · AI FLUENCY =================== */
const L1 = [
{
  id:"start", title:"Ce e AI Fluency", sub:"Prima lecție", time:"8 min",
  body:`
  <p>Începem cu <b>Nivelul 1 · AI Fluency</b>. Aici înveți cum se lucrează bine cu <b>orice</b> AI, nu doar cu Claude.</p>
  <h3>Ce e „AI Fluency”?</h3>
  <p>Așa cum „fluent în engleză” nu înseamnă să știi gramatica pe de rost, ci să te descurci natural, <b>AI Fluency</b> înseamnă să lucrezi cu AI-ul <b>eficient</b> (obții ce vrei), <b>inteligent</b> (știi când să ai încredere) și <b>responsabil</b> (nu faci rău nimănui, nici ție).</p>
  <p>Uneltele se schimbă la câteva luni. Modul de gândire rămâne. De aceea începem cu el.</p>
  <div class="card"><b>Cum arată fiecare lecție:</b>
    <ol>
      <li>Citești explicația.</li>
      <li>Faci <b>provocarea</b>: un mic experiment cu Claude. Nu contează dacă iese cum crezi, contează ce verifici și ce concluzionezi.</li>
      <li>Răspunzi la mini-quiz. Când e corect, lecția se bifează și treci mai departe.</li>
    </ol>
  </div>
  `,
  challenge:{"label": "Cât de bine se cunoaște Claude?", "goal": "Afli dacă Claude își cunoaște corect propriile limite.", "hyp": "Notează ce crezi: o să-și supraestimeze limitele, o să le subestimeze sau o să le spună corect?", "test": "Cere-i 3 lucruri la care crede că e slab, cu exemple concrete. Apoi testează unul dintre ele într-o conversație nouă.", "check": "Chiar a greșit acolo unde a spus că e slab? Sau s-a descurcat mai bine decât a zis?", "concl": "Scrie în 2 rânduri: cât de bine se cunoaște Claude, din ce ai văzut tu.", "prompt": "Spune-mi 3 lucruri la care crezi că ești slab, cu câte un exemplu concret pe care să-l pot testa chiar acum."},
  quiz:[
    {q:"Ce înseamnă „AI Fluency”?", o:["Să știi cum e programat un AI","Să lucrezi cu AI-ul eficace, eficient, etic și sigur","Să folosești AI-ul cât mai des","Să știi pe de rost toate comenzile unui AI"], a:1, e:"Exact definiția din cursul oficial: effectively, efficiently, ethically, and safely."},
    {q:"De ce începem cu modul de gândire, nu cu butoanele?", o:["Pentru că butoanele se schimbă des, modul de gândire rămâne","Pentru că e mai ușor","Pentru că butoanele sunt prea greu de învățat","Pentru că Claude nu are butoane"], a:0, e:"Exact. Ce înveți aici merge și cu alte AI-uri."}
  ]
},
{
  id:"4d", title:"Modelul 4D", sub:"Cele 4 competențe", time:"10 min",
  body:`
  <p>Cursurile oficiale de AI Fluency sunt construite în jurul a patru competențe, toate începând cu „D” în engleză. Le folosim ca fir roșu în tot nivelul.</p>
  <div class="card">
    <ol>
      <li><b>Delegare</b> (<i>Delegation</i>): decizi <b>ce</b> faci tu, ce face AI-ul și ce faceți împreună.</li>
      <li><b>Descriere</b> (<i>Description</i>): explici clar ce vrei: context, sarcină, format.</li>
      <li><b>Discernământ</b> (<i>Discernment</i>): judeci ce primești: e corect, e bun, e ce trebuia?</li>
      <li><b>Diligență</b> (<i>Diligence</i>): îți asumi rezultatul: ești cinstit, verifici, nu faci rău.</li>
    </ol>
  </div>
  <h3>Trei moduri de a lucra cu AI-ul</h3>
  <div class="card">
    <ul>
      <li><b>Automatizare</b> (<i>Automation</i>): AI-ul execută o sarcină anume, după instrucțiunile tale.</li>
      <li><b>Augmentare</b> (<i>Augmentation</i>): tu și AI-ul lucrați împreună, ca parteneri de gândire și execuție.</li>
      <li><b>Agenție</b> (<i>Agency</i>): AI-ul lucrează independent în numele tău. Tu îi stabilești cunoștințele și comportamentul, nu fiecare acțiune.</li>
    </ul>
    <p class="tip" style="margin:6px 0 0">Cele 4D se aplică în toate trei. Când înveți ceva, <b>augmentarea</b> valorează mai mult decât automatizarea: lucrezi cu AI-ul, nu-l lași să lucreze în locul tău.</p>
  </div>
  <h3>Un exemplu: referatul la istorie</h3>
  <ul>
    <li><b>Delegare:</b> tu alegi tema și ideile principale. Îi ceri lui Claude să te ajute cu structura și cu întrebări care să te ducă mai departe.</li>
    <li><b>Descriere:</b> „Am de scris 2 pagini despre cauzele Primului Război Mondial pentru clasa a XII-a. Propune-mi o structură în 5 părți.”</li>
    <li><b>Discernământ:</b> verifici datele și numele în manual.</li>
    <li><b>Diligență:</b> scrii tu textul și spui sincer cum ai folosit AI-ul, dacă profesorul cere asta.</li>
  </ul>
  `,
  challenge:{"label": "Delegarea greșită", "goal": "Vezi ce se întâmplă când îi dai AI-ului ceva ce n-ar trebui să facă în locul tău.", "hyp": "Ce crezi că face Claude dacă îi ceri părerea TA despre ceva: o inventează, te întreabă sau refuză?", "test": "Cere-i: „Scrie-mi părerea mea despre ultimul film pe care l-am văzut.” Nu-i da alte detalii.", "check": "A inventat o părere? Te-a întrebat ce film? A spus că nu poate ști?", "concl": "Care dintre cele 4D a fost încălcată aici și cum ai fi împărțit corect munca?", "prompt": "Scrie-mi părerea mea despre ultimul film pe care l-am văzut."},
  quiz:[
    {q:"Verifici în manual datele dintr-un răspuns. Ce „D” e asta?", o:["Delegare","Descriere","Discernământ","Diligență"], a:2, e:"Discernământ = judeci ce primești."},
    {q:"Decizi ce faci tu și ce face AI-ul. Ce „D” e asta?", o:["Delegare","Descriere","Discernământ","Diligență"], a:0, e:"Delegare = împărțirea muncii."},
    {q:"Îți asumi rezultatul și ești cinstit despre cum ai folosit AI-ul. Ce „D” e asta?", o:["Delegare","Descriere","Discernământ","Diligență"], a:3, e:"Diligență = responsabilitate."},
    {q:"Lucrezi cu AI-ul ca partener de gândire la un proiect. Ce mod e ăsta?", o:["Automation","Augmentation","Agency","Delegation"], a:1, e:"Augmentation: colaborați ca parteneri."}
  ]
},
{
  id:"ce-e", title:"Cum funcționează AI-ul generativ", sub:"Următorul cuvânt și „caracterul” AI-ului", time:"12 min",
  body:`
  <p>Claude e un <b>model de limbaj</b>. A învățat din cantități uriașe de text cum se leagă cuvintele și ideile.</p>
  <h3>Ideea de bază: următorul cuvânt</h3>
  <p>Când îi scrii ceva, Claude construiește răspunsul bucată cu bucată (bucățile se numesc <i>tokeni</i>, adică cuvinte sau părți de cuvinte), alegând de fiecare dată ce urmează cel mai potrivit. Sună simplu, dar la scara asta iese ceva care poate explica fizică, scrie povești sau repara cod.</p>
  <h3>De ce a devenit posibil acum</h3>
  <p>Trei lucruri s-au întâlnit: algoritmi noi (mai ales arhitectura <i>transformer</i>), cantități uriașe de text digital și putere de calcul mult mai mare.</p>
  <h3>De unde are „caracterul”?</h3>
  <p>Învățarea are două etape:</p>
  <ol>
    <li><b>Pre-antrenarea</b> (<i>pretraining</i>): modelul învață să prezică „ce urmează” pe miliarde de texte. După etapa asta e doar un „completator de documente”, nu un asistent.</li>
    <li><b>Ajustarea</b> (<i>fine-tuning</i>): e antrenat să-ți trateze mesajul ca pe o cerere, să răspundă la obiect și să refuze ce e dăunător, pe baza aprecierilor făcute de oameni.</li>
  </ol>
  <p>Ajustarea lasă și <b>urme</b> pe care e bine să le recunoști: tendința de a-ți da dreptate (<i>sycophancy</i>), răspunsuri prea lungi, uneori prea multă prudență și o încredere afișată care nu se potrivește mereu cu cât de sigur e de fapt răspunsul.</p>
  <div class="card">
    <b>Ce rezultă de aici:</b>
    <ul>
      <li>Nu „caută” răspunsul ca Google (decât dacă are acces la căutare). Îl <b>generează</b>.</li>
      <li>Poate genera ceva care sună perfect, dar e fals. Asta se numește <b>halucinație</b>.</li>
      <li>Același prompt poate da răspunsuri ușor diferite de la o încercare la alta.</li>
    </ul>
  </div>
  `,
  challenge:{"label": "Același prompt, trei răspunsuri", "goal": "Vezi cu ochii tăi că AI-ul nu „caută” un răspuns fix, ci îl generează de fiecare dată.", "hyp": "Dacă trimiți exact același prompt de 3 ori, crezi că răspunsurile vor fi identice, asemănătoare sau foarte diferite?", "test": "Trimite promptul de mai jos în 3 conversații noi, sau folosește butonul de regenerare a răspunsului.", "check": "Compară cele 3 răspunsuri: ce e la fel, ce diferă (cuvinte, ordine, idei)?", "concl": "Explică, folosind ideea de „următorul cuvânt”, de ce răspunsurile nu sunt identice.", "prompt": "Inventează un nume pentru o cafenea din București și explică-l într-o propoziție."},
  quiz:[
    {q:"Cum construiește Claude un răspuns?", o:["Copiază o pagină de pe internet","Generează bucată cu bucată ce urmează cel mai potrivit","Îl scrie un om în spate","Caută răspunsul într-o bază cu răspunsuri gata scrise"], a:1, e:"Predicție pas cu pas, pe baza tiparelor învățate."},
    {q:"Ce e o „halucinație” la un AI?", o:["Când refuză să răspundă","Când generează ceva fals, dar credibil","Când răspunde încet","Când inventează intenționat ca să te păcălească"], a:1, e:"De aceea verifici informațiile importante."},
    {q:"De unde vine tonul de „asistent” al lui Claude?", o:["Din etapa de fine-tuning, după pre-antrenare","E pur întâmplător","Dintr-un fișier cu fraze politicoase gata scrise","Din conversațiile tale anterioare"], a:0, e:"Pretraining îl face să continue text, fine-tuning îl face asistent."},
    {q:"Ce e „sycophancy” la un AI?", o:["Tendința de a-ți da dreptate","O eroare de rețea","Un tip de model","Tendința de a răspunde foarte lung"], a:0, e:"E una dintre urmele lăsate de fine-tuning. De aceea ceri critică, nu confirmare."}
  ]
},
{
  id:"capabilitati", title:"Capabilități și limite", sub:"Cunoștințe, memorie, ghidare", time:"20 min",
  body:`
  <p>Cursul oficial <i>AI Capabilities and Limitations</i> descrie AI-ul generativ prin <b>patru proprietăți</b>: <b>Next Token Prediction</b> (următorul cuvânt, din lecția trecută), <b>Knowledge</b> (cunoștințe), <b>Working Memory</b> (memorie de lucru) și <b>Steerability</b> (cât de ușor îl ghidezi). Fiecare e o scală, nu „merge / nu merge”: același mecanism îi dă și puterea, și limita.</p>
  <p><b>Next Token Prediction, pe scurt:</b> merge foarte bine la ce seamănă cu tipare văzute des (rezumate, reformulări, explicații de concepte comune). Greșește mai ales la <b>detalii precise</b>: nume, date, cifre, citate, surse, linkuri. Cu cât afirmația e mai precisă, cu atât trebuie verificată mai atent.</p>
  <h3>1. Cunoștințele (Knowledge)</h3>
  <p>Claude știe foarte multe, dar cunoștințele lui se opresc la o <b>dată-limită</b> (când s-a terminat antrenarea). Despre ce e mai nou află doar dacă poate căuta pe internet. E bun la subiecte frecvente și slab la cele <b>rare, foarte noi, de nișă, locale sau controversate</b>. Moștenește și prejudecățile din datele de antrenare și nu poate spune exact de unde știe ceva. Căutarea pe web și conectorii există tocmai ca să acopere golurile astea.</p>
  <div class="card try"><div class="label">⚡ Testează-i cunoștințele</div><div class="prompt">Până la ce dată ai informații? Dă-mi un exemplu de întrebare la care ai răspunde sigur și unul la care ai putea greși, și explică de ce.</div><div class="btns"></div></div>
  <h3>2. Memoria de lucru (Working Memory)</h3>
  <p>Într-o conversație, Claude „vede” tot ce s-a scris în ea până atunci (zona asta se numește <b>fereastră de context</b>). E mare, dar nu infinită, iar limita e bruscă: când se umple, ce e în plus poate fi tăiat <b>fără să fii avertizat</b>. Informațiile îngropate la mijlocul unui text foarte lung sunt cel mai ușor scăpate. O <b>conversație nouă</b> pornește de la zero, iar corecturile tale nu-l „învață” pentru data viitoare: răspunde doar la ce e acum în conversație.</p>
  <div class="card try"><div class="label">⚡ Testează-i memoria</div><div class="prompt">Îți dau 3 informații: culoarea mea preferată e verde, am un câine pe nume Bobi și îmi place fotbalul. Acum scrie-mi o poezie scurtă despre toamnă. După poezie, spune-mi cele 3 informații de la început.</div><div class="btns"></div></div>
  <p class="tip">Apoi deschide o conversație nouă și întreabă-l cum îl cheamă pe câinele tău. Vezi ce se întâmplă.</p>
  <h3>3. Ghidarea (Steerability)</h3>
  <p>Urmează foarte bine instrucțiuni <b>scurte, concrete și verificabile</b>: format, lungime, rol („fii profesorul meu”). Merge mai prost la raționamente lungi (greșelile mici se adună) și la instrucțiuni vagi. Uneori respectă <b>litera</b> cererii, dar nu și <b>intenția</b>. Atunci nu repeta instrucțiunea mai apăsat, ci <b>reformulează scopul</b>: ce vrei de fapt să obții.</p>
  <div class="card try"><div class="label">⚡ Testează ghidarea</div><div class="prompt">Explică-mi ce e gravitația de 3 ori: o dată pentru un copil de 7 ani, o dată pentru un elev de liceu și o dată ca un comentator sportiv entuziasmat.</div><div class="btns"></div></div>
  <h3>Când proprietățile se ciocnesc</h3>
  <p>Greșelile reale vin de obicei din <b>două proprietăți combinate</b>:</p>
  <ul>
    <li><b>Next Token Prediction + Knowledge</b> → detalii inventate (cifre, nume, surse). Remediu: verifici detaliile.</li>
    <li><b>Working Memory + Steerability</b> → într-o conversație lungă „uită” regulile de la început. Remediu: începi o conversație nouă și îi dai din nou ce e important.</li>
  </ul>
  <p>Ideea centrală a cursului oficial e <b>încrederea calibrată</b> (<i>calibrated trust</i>): nu ai încredere în AI „în general”, ci te întrebi unde se află sarcina ta pe fiecare scală și verifici pe măsură.</p>
  `,
  challenge:{"label": "Găsește limita", "goal": "Testezi pe viu cele trei proprietăți: cunoștințe, memorie de lucru și ghidare.", "hyp": "La care dintre cele trei crezi că e cel mai ușor să-l faci să greșească?", "test": "Fă cel puțin unul dintre experimente: (1) întreabă-l despre ceva petrecut săptămâna asta; (2) insistă de 3 ori că o informație falsă e adevărată (de exemplu că Dunărea izvorăște din Carpați) și vezi dacă cedează; (3) dă-i o regulă la început („răspunde mereu cu maximum 2 propoziții”) și vezi după câte mesaje o uită.", "check": "Verifică singur informația pe o sursă de încredere. A cedat? A uitat? A recunoscut că nu știe?", "concl": "Ce proprietate ai testat, ce s-a întâmplat și ce înseamnă asta pentru cum îl folosești tu.", "prompt": ""},
  quiz:[
    {q:"Deschizi o conversație nouă. Ce știe Claude din cea veche?", o:["Tot","Nimic, dacă nu i-ai dat tu informația din nou","Doar titlul conversației vechi","Ultimele câteva mesaje"], a:1, e:"Fiecare conversație nouă pornește de la zero."},
    {q:"Întrebi despre ceva petrecut ieri. Ce e de așteptat?", o:["Știe sigur","Fără căutare pe internet, s-ar putea să nu știe sau să greșească","Află automat din știri, fără căutare","Refuză orice întrebare despre lucruri recente"], a:1, e:"Cunoștințele lui au o dată-limită."},
    {q:"O conversație foarte lungă începe să uite instrucțiunile de la început. Ce faci?", o:["Continui oricum","Începi o conversație nouă și îi dai din nou ce e important","Scrii instrucțiunile cu majuscule","Ștergi mesajele vechi din conversație"], a:1, e:"E combinația Working Memory + Steerability."},
    {q:"Unde inventează AI-ul cel mai des?", o:["La rezumatul unui text","La detalii precise: nume, cifre, citate, linkuri","La explicarea unor idei generale","La corectarea gramaticii"], a:1, e:"Fabricarea se concentrează în detalii precise."},
    {q:"A respectat cuvintele cererii, dar nu ce voiai. Ce faci?", o:["Repeți instrucțiunea mai apăsat","Reformulezi scopul, ce vrei de fapt","Accepți rezultatul, așa funcționează AI-ul","Treci la alt AI"], a:1, e:"Letter-over-spirit se rezolvă reformulând intenția."}
  ]
},
{
  id:"delegare", title:"Delegarea", sub:"Ce faci tu, ce face AI-ul", time:"12 min",
  body:`
  <p>Prima întrebare nu e „ce prompt scriu?”, ci <b>„ce vreau să obțin și cine face ce?”</b>. Cursul oficial împarte Delegarea în trei:</p>
  <div class="card">
    <ul>
      <li><b>Înțelegerea problemei</b> (<i>Problem Awareness</i>): știi clar ce vrei să obții și ce fel de muncă e, înainte să implici AI-ul.</li>
      <li><b>Cunoașterea platformei</b> (<i>Platform Awareness</i>): știi ce poate și ce nu poate face AI-ul pe care îl folosești.</li>
      <li><b>Împărțirea sarcinilor</b> (<i>Task Delegation</i>): împarți munca între tine și AI după ce face fiecare mai bine.</li>
    </ul>
    <p class="tip" style="margin:6px 0 0">Scopul nu e să automatizezi tot, ci să faci cel mai bun parteneriat om–AI pentru sarcina respectivă. Cele trei moduri (Automation, Augmentation, Agency) le-ai văzut la lecția despre 4D.</p>
  </div>
  <h3>Ce NU deleghezi</h3>
  <ul>
    <li>Ce trebuie să <b>înveți tu</b>. Dacă AI-ul îți face tema, n-ai învățat nimic.</li>
    <li>Deciziile importante despre viața ta (le discuți cu el, dar le iei tu).</li>
    <li>Ce nu poți verifica deloc, dacă o greșeală ar costa mult.</li>
  </ul>
  <h3>Planificarea unui proiect</h3>
  <p>Înainte de un proiect mai mare, fă-ți un plan scurt: <b>scopul</b>, <b>pașii</b> și, la fiecare pas, <b>cine îl face</b> (tu, AI-ul sau amândoi). Durează 5 minute și te scapă de ore pierdute.</p>
  `,
  challenge:{"label": "Plan cu și fără context", "goal": "Măsori cât de mult contează să-i explici situația ta înainte să-i ceri un plan.", "hyp": "Crezi că 3 propoziții de context schimbă mult planul sau aproape deloc?", "test": "Cere același plan pentru un proiect real al tău de două ori, în conversații separate: o dată fără nimic în plus, o dată cu 3 propoziții despre tine (timp, nivel, scop) și cu cerința să împartă pașii între tu / Claude / împreună.", "check": "Pune planurile unul lângă altul. Care e mai realist? Care l-ai urma?", "concl": "Ce anume din context a schimbat cel mai mult planul?", "prompt": "Ajută-mă cu un plan ca să [proiectul tău real]."},
  quiz:[
    {q:"Ce nu e bine să deleghezi complet?", o:["Formatarea unei liste","Ce ai nevoie să înveți tu","Traducerea unui paragraf","Găsirea sinonimelor"], a:1, e:"Ce trebuie să știi tu, trebuie să faci tu."},
    {q:"Lucrezi la un eseu cu dus-întors cu AI-ul. Ce mod e ăsta?", o:["Automation","Augmentation","Agency","Delegation"], a:1, e:"Augmentation = lucrați împreună, ca parteneri."},
    {q:"Ce înseamnă Platform Awareness?", o:["Să știi ce poate și ce nu poate face AI-ul pe care îl folosești","Să ai cel mai nou telefon","Să știi pe ce platformă de social media e AI-ul","Să știi pe ce server rulează AI-ul"], a:0, e:"E una dintre cele trei părți ale Delegării."}
  ]
},
{
  id:"prompt", title:"Descrierea", sub:"Cum ceri ca să primești", time:"15 min",
  body:`
  <p>„Promptul” e ce îi scrii. Diferența dintre un răspuns banal și unul excelent stă aproape mereu în <b>cât de clar ai cerut</b>.</p>
  <div class="compare">
    <div class="card"><div class="bad-t">✗ Vag</div><div class="prompt">scrie despre al doilea război mondial</div><p class="tip">Primești ceva generic, lung, poate nu ce îți trebuia.</p></div>
    <div class="card"><div class="good-t">✓ Clar</div><div class="prompt">Am un test la istorie despre cauzele celui de-al Doilea Război Mondial. Fă-mi un rezumat de 10 rânduri, apoi 5 întrebări cu care să mă verific.</div><p class="tip">Primești exact ce te ajută.</p></div>
  </div>
  <h3>Ce descrii (cele trei tipuri din cursul oficial)</h3>
  <div class="card">
    <ul>
      <li><b>Produsul</b> (<i>Product Description</i>): ce vrei să primești: rezultat, format, public, stil.</li>
      <li><b>Procesul</b> (<i>Process Description</i>): cum să abordeze cererea („întâi pune-mi întrebări”, „gândește pas cu pas”).</li>
      <li><b>Performanța</b> (<i>Performance Description</i>): cum să se comporte în colaborare: concis sau detaliat, provocator sau încurajator („fii profesorul meu și nu-mi da răspunsul”).</li>
    </ul>
    <p class="tip" style="margin:6px 0 0">AI-ul e un partener interactiv, nu o bază de date sau un automat de cafea.</p>
  </div>
  <h3>Cele 6 tehnici de bază</h3>
  <ol>
    <li><b>Dă context</b>: ce vrei, de ce și ce fundal are situația.</li>
    <li><b>Arată exemple</b> de cum vrei să arate rezultatul.</li>
    <li><b>Specifică constrângerile</b>: format, lungime, alte cerințe.</li>
    <li><b>Împarte sarcinile complexe în pași.</b></li>
    <li><b>Cere-i să gândească întâi</b>, înainte să răspundă.</li>
    <li><b>Stabilește rolul sau tonul</b>: „ești antrenorul meu de fotbal”.</li>
  </ol>
  <p><b>Arma secretă:</b> cere-i chiar AI-ului să te ajute să-ți îmbunătățești promptul. Și ține minte că promptingul e <b>iterativ</b>: rafinezi după fiecare răspuns.</p>
  <h3>Construiește-ți propriul prompt</h3>
  <div class="card builder">
    <label>Contextul (cine ești, ce situație ai)</label>
    <input id="b1" placeholder="ex: Sunt la liceu și vreau să învăț să gătesc">
    <label>Sarcina (ce vrei de la Claude)</label>
    <input id="b2" placeholder="ex: propune-mi 3 rețete simple pentru săptămâna asta">
    <label>Formatul</label>
    <select id="b3">
      <option>o listă cu pași numerotați</option><option>un tabel</option><option>un text scurt, de maximum 10 rânduri</option><option>un plan pe zile</option><option>un quiz cu întrebări</option>
    </select>
    <label>Nivelul</label>
    <select id="b4">
      <option>pentru un începător total</option><option>cu termeni simpli, dar fără să mă trateze ca pe un copil</option><option>avansat, cu detalii</option>
    </select>
    <div class="prompt" id="bout">Completează câmpurile de mai sus…</div>
    <div class="btns"><button class="btn" onclick="copyText(document.getElementById('bout').textContent,this)">📋 Copiază</button><a class="btn primary" href="${CLAUDE}" target="_blank" rel="noopener">Deschide Claude ↗</a></div>
  </div>
  `,
  challenge:{"label": "Bătălia prompturilor", "goal": "Afli care „ingredient” al unui prompt contează cel mai mult.", "hyp": "Dintre context, format și exemplu, care crezi că îmbunătățește cel mai mult rezultatul?", "test": "Aceeași sarcină în 3 conversații noi: (A) promptul vag; (B) cu context și format; (C) cu context, format și un exemplu de cum vrei să arate. Poți folosi constructorul de mai sus pentru B.", "check": "Dă fiecărui rezultat o notă de la 1 la 10 și scrie de ce.", "concl": "Care ingredient a făcut cea mai mare diferență și când n-ar merita efortul?", "prompt": ""},
  quiz:[
    {q:"Care prompt va da un răspuns mai bun?", o:["„explică fotosinteza”","„Am test la bio mâine. Explică-mi fotosinteza în 5 pași simpli și dă-mi un exemplu din viața reală.”","„explică fotosinteza, dar bine”","„FOTOSINTEZA!!! repede”"], a:1, e:"Are context, sarcină, format și nivel."},
    {q:"„Fii profesorul meu și nu-mi da răspunsul direct” e ce tip de descriere?", o:["Product","Process","Performance","Delegation"], a:2, e:"Performance Description: cum să se comporte în colaborare."},
    {q:"Care e „arma secretă” din cursul oficial?", o:["Să scrii promptul cu majuscule","Să-i ceri AI-ului să te ajute să-ți îmbunătățești promptul","Să scrii prompturi cât mai scurte","Să folosești mereu același prompt"], a:1, e:"Promptingul poate fi și el o colaborare."},
    {q:"Primul răspuns nu e ce voiai. Ce faci?", o:["Renunți","Continui și îi spui ce să schimbe","Scrii exact același mesaj din nou","Treci imediat la alt AI"], a:1, e:"Conversația e unealta ta."}
  ]
},
{
  id:"verifica", title:"Discernământul", sub:"Judecă ce primești", time:"15 min",
  body:`
  <p>Cea mai importantă competență cu AI nu e să scrii prompturi, ci să <b>judeci ce primești</b>. Ca la Descriere, sunt trei tipuri:</p>
  <div class="card">
    <ul>
      <li><b>Produsul</b> (<i>Product Discernment</i>): calitatea rezultatului: corect, potrivit, coerent, relevant.</li>
      <li><b>Procesul</b> (<i>Process Discernment</i>): cum a ajuns la rezultat: greșeli de logică, lucruri scăpate, raționament nepotrivit.</li>
      <li><b>Performanța</b> (<i>Performance Discernment</i>): cum s-a comportat în colaborare: te-a ajutat stilul lui sau doar ți-a dat dreptate?</li>
    </ul>
  </div>
  <h3>Unde să fii atent</h3>
  <ul>
    <li><b>Cifre, date, nume, citate și surse</b>. Aici apar cele mai multe greșeli. Deschide linkurile.</li>
    <li><b>Calcule lungi</b>. Cere pașii sau verifică cu un calculator.</li>
    <li><b>Sănătate, bani, legi</b>. Folosește-l ca să înțelegi subiectul, dar decizia o iei cu un specialist.</li>
  </ul>
  <h3>Bucla Descriere ↔ Discernământ (<i>Description-Discernment loop</i>)</h3>
  <p>Lucrul bun cu AI-ul e o buclă: <b>descrii → judeci rezultatul → descrii mai bine → judeci din nou</b>. Fiecare tură te apropie de ce vrei. Întrebări utile în buclă:</p>
  <ol>
    <li>„Cât de sigur ești pe asta?”</li>
    <li>„Ce ar putea fi greșit în răspunsul tău?”</li>
    <li>„Cum pot verifica eu asta singur?”</li>
  </ol>
  `,
  challenge:{"label": "Prinde-l inventând", "goal": "Testezi dacă și când AI-ul inventează informații care sună credibil.", "hyp": "Crezi că o să inventeze ceva, o să spună că nu e sigur sau o să răspundă corect?", "test": "Întreabă-l ceva foarte mărunt și verificabil: populația unei comune mici din județul tău, un citat exact al unui profesor de la tine din oraș, sau o carte a unui autor român puțin cunoscut, cu titlu și an. Cere-i și sursa. Încearcă 2–3 variante.", "check": "Caută singur pe Google sau pe un site oficial. Există sursa? Cifra e corectă? Întreabă-l apoi „Cât de sigur ești?” și vezi ce răspunde.", "concl": "A inventat, a recunoscut că nu știe sau a fost corect? Oricare ar fi, ce ai învățat despre când să verifici?", "prompt": ""},
  quiz:[
    {q:"Claude îți dă o carte ca sursă. Ce faci?", o:["O treci direct în referat","O cauți să vezi dacă există și dacă spune ce zice el","O treci, dar cu „după Claude” în paranteză","O ștergi, toate sursele date de AI sunt false"], a:1, e:"Sursele inventate sunt o greșeală clasică."},
    {q:"Ce e bucla Descriere–Discernământ?", o:["Scrii un singur prompt perfect","Descrii, judeci, descrii mai bine, judeci din nou","Îi ceri AI-ului să-și judece singur răspunsul și accepți ce zice","Alternezi între două AI-uri diferite"], a:1, e:"Rezultatele bune vin din câteva ture."}
  ]
},
{
  id:"responsabil", title:"Diligența", sub:"Omul rămâne responsabil", time:"10 min",
  body:`
  <p>AI-ul te ajută, dar <b>tu răspunzi</b> de ce faci cu el. Asta înseamnă să rămâi „omul din buclă” (<i>human in the loop</i>): tu decizi, tu verifici, tu îți asumi. Cursul oficial împarte Diligența în trei:</p>
  <div class="card">
    <ul>
      <li><b>La creare</b> (<i>Creation Diligence</i>): alegi cu grijă ce AI folosești și cum lucrezi cu el.</li>
      <li><b>Transparență</b> (<i>Transparency Diligence</i>): ești cinstit despre rolul AI-ului în munca ta, cu toți cei care trebuie să știe.</li>
      <li><b>La folosire</b> (<i>Deployment Diligence</i>): verifici și garantezi pentru ce folosești sau trimiți mai departe.</li>
    </ul>
  </div>
  <h3>La școală și la facultate</h3>
  <div class="compare">
    <div class="card"><div class="good-t">✓ Bine</div><ul><li>„Explică-mi asta altfel”</li><li>„Verifică-mi rezolvarea și spune-mi unde am greșit”</li><li>„Fă-mi întrebări de test”</li><li>„Dă-mi feedback la eseul meu”</li></ul></div>
    <div class="card"><div class="bad-t">✗ Nu ajută</div><ul><li>Copiezi tema întreagă</li><li>Predai un text scris de AI ca fiind al tău</li><li>Nu mai înțelegi ce predai</li></ul></div>
  </div>
  <p>Fiecare profesor are regulile lui despre AI. Întreabă-l și fii <b>transparent</b> despre cum l-ai folosit.</p>

  <ul>
    <li>Nu-i da parole, coduri de card sau CNP.</li>
    <li>Nu pune informații private despre alți oameni fără acordul lor.</li>
  </ul>
  <h3>Mintea ta</h3>
  <p>Claude poate fi un partener foarte bun de discuție, dar nu înlocuiește prietenii, familia sau un specialist când ai o problemă serioasă.</p>
  `,
  challenge:{"label": "Vocea ta vs. vocea lui", "goal": "Vezi diferența dintre un text scris de tine cu ajutor și unul scris de AI.", "hyp": "Crezi că s-ar vedea diferența dintre un paragraf scris de tine și unul scris de Claude?", "test": "Scrie TU un paragraf scurt despre ceva ce-ți place. Cere-i lui Claude doar feedback, fără să-l rescrie, și îmbunătățește-l tu. Separat, într-o conversație nouă, cere-i lui Claude să scrie un paragraf pe aceeași temă.", "check": "Pune cele două variante una lângă alta. Ce e diferit? Care sună a tine?", "concl": "Ce pierzi dacă îl lași pe AI să scrie în locul tău și când e totuși ok să-l folosești?", "prompt": "Uite un paragraf scris de mine. NU-l rescrie. Spune-mi doar 3 lucruri bune și 3 de îmbunătățit:\n\n[paragraful tău]"},
  quiz:[
    {q:"Care e folosirea cea mai utilă pentru învățat?", o:["Îi ceri să-ți scrie tema","Îi ceri să te verifice și să-ți explice unde ai greșit","Îi ceri să-ți rezume capitolul ca să nu-l mai citești","Îi ceri să-ți dea răspunsurile la test"], a:1, e:"Așa chiar înveți."},
    {q:"Ce înseamnă să fii „omul din buclă”?", o:["Tu decizi, tu verifici, tu îți asumi","Lași AI-ul să decidă","Verifici doar când ți se pare ceva ciudat","Lași un coleg să verifice în locul tău"], a:0, e:"Responsabilitatea nu se deleghează."},
    {q:"Spui profesorului că ai folosit AI-ul la un proiect. Ce tip de Diligență e asta?", o:["Creation","Transparency","Deployment","Delegation"], a:1, e:"Transparency Diligence: onestitate despre rolul AI-ului."}
  ]
},
{
  id:"invatare", title:"AI pentru învățat și carieră", sub:"AI Fluency pentru studenți", time:"15 min",

const VERIFY_URL="https://curs-ai.andrei477.workers.dev";
function gateAutoHTML(L,next){
  const links=(state.badgeLinks||{})[L.n]||{};
  return `<div class="card"><b>✨ Verificare automată</b>

    ${L.gate.map(g=>`<label style="display:block;font-weight:600;font-size:14.5px;margin:10px 0 4px">${g[1]} · ${g[2]} lei</label><input class="pin blink" data-slug="${g[0]}" value="${esc(links[g[0]]||'')}" placeholder="https://academy.claude.com/verify/..." autocomplete="off">`).join("")}
    <div class="btns"><button class="btn primary" id="vbtn">Verifică badge-urile ✨</button></div>
    <div id="vmsg" class="fb"></div></div>
    <p class="tip" style="text-align:center">sau, dacă verificarea automată nu merge:</p>`;
}
function bindGateAuto(i,L,next){
  const btn=document.getElementById("vbtn"); if(!btn) return;
  document.querySelectorAll(".blink").forEach(el=>el.addEventListener("input",()=>{ state.badgeLinks=state.badgeLinks||{}; (state.badgeLinks[L.n]=state.badgeLinks[L.n]||{})[el.dataset.slug]=el.value.trim(); save(); }));
  btn.onclick=async()=>{
    const msg=document.getElementById("vmsg");
    const links=[...document.querySelectorAll(".blink")].map(el=>el.value.trim()).filter(Boolean);
    if(!links.length){ msg.innerHTML='<span class="bad-t">Lipește cel puțin un link de verificare.</span>'; return; }
    btn.disabled=true; msg.textContent="Se verifică la Claude Academy…";
    let r;
    try{ const res=await fetch(VERIFY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({level:L.n,links})}); r=await res.json(); }
    catch(e){ btn.disabled=false; msg.innerHTML='<span class="bad-t">Serviciul de verificare nu răspunde acum. Încearcă mai târziu sau cere codul de la '+PARENT+'.</span>'; return; }
    let h=(r.results||[]).map(x=>`<div>${x.ok?'✅':'❌'} ${esc(x.course||x.link)}${x.ok?' · pe numele '+esc(x.name):': '+esc(x.msg)}</div>`).join("");
    if(r.ok && r.code){
      try{ await unlock(next,r.code); state.badgeOwner=r.owner; save(); renderNav(); go(i); return; }
      catch(e){ h+='<div class="bad-t">Badge-urile sunt valide, dar codul nu s-a potrivit. Spune-i lui '+PARENT+'.</div>'; }
    } else if(r.missing&&r.missing.length){
      h+=`<div class="tip" style="margin-top:6px">Mai lipsesc: ${r.missing.map(esc).join(", ")}.</div>`;
    }
    if(r.error) h+=`<div class="bad-t">${esc(r.error)}</div>`;
    msg.innerHTML=h; btn.disabled=false;
  };
}

/* ---------- PARCURGERE ÎN ORDINE ---------- */
function accessible(i){
  const it=ITEMS[i]; if(!it) return false;
  if(it.type==="intro"||it.type==="locked"||it.type==="final") return true;
  const L=it.L;
  if(it.type==="lesson"){ const k=L.lessons.indexOf(it.l); return k===0||!!state.done[L.lessons[k-1].id]||!!state.done[it.l.id]; }
  if(it.type==="proof"||it.type==="diploma") return levelDone(L);
  if(it.type==="gate") return !!state.unlock[L.n+1]||(levelDone(L)&&(L.short||proofsDone(L)));
  return true;
}
function blockerOf(i){
  const it=ITEMS[i], L=it.L;
  const l=L.lessons.find(x=>!state.done[x.id]);
  if(l) return {i:ITEMS.findIndex(x=>x.l===l), t:`lecția „${l.title}”`};
  return {i:ITEMS.findIndex(x=>x.type==="proof"&&x.L===L), t:"dovezile nivelului"};
}
function renderBlocked(i){
  const b=blockerOf(i);
  main.innerHTML=`<h2>🔒 Încă nu</h2><p>Pasul ăsta se deschide după ce termini <b>${b.t}</b>. Lecțiile se parcurg în ordine: fiecare se deblochează când răspunzi corect la mini-quiz-ul celei dinainte.</p><div class="btns"><button class="btn primary" onclick="go(${b.i})">Du-mă la ${b.t} →</button></div>`;
}
function markLocked(){
  nav.querySelectorAll('button[onclick^="go("]').forEach(btn=>{
    const i=+btn.getAttribute("onclick").match(/\d+/)[0];
    if(!accessible(i)){ btn.classList.add("locked"); const dot=btn.querySelector(".dot"); if(dot) dot.textContent="🔒"; }
  });
}

/* ---------- FEEDBACK DE LA CLAUDE PE PROVOCARE (obligatoriu ca să treci mai departe) ---------- */
const fbUrl=()=>SYNC_URL.replace(/\/sync$/,"/feedback");
const fbDone=id=>!!(state.fb&&state.fb[id]&&(state.fb[id].reply||state.fb[id].skipped));
function fbView(f){
  if(!f) return "";
  if(f.skipped) return `<div class="tip">⚠️ Feedback-ul automat nu a fost disponibil (${esc(f.skipped)}). Ai putut trece mai departe; linkul tău apare în raport.</div>`;
  return `<div class="card" style="background:var(--soft,#f4efe7);margin:8px 0 0"><b>💬 Feedback de la Claude</b>${f.source==="text"?' <span class="tip">(pe textul scris de tine)</span>':''}<div style="margin-top:6px">${esc(f.reply).replace(/\n/g,"<br>")}</div></div>`;
}
function fbBox(id){
  const f=(state.fb||{})[id];
  return `<div class="fbbox" id="fb-${id}" style="margin-top:14px;border-top:1px dashed #ccc;padding-top:12px">
  <b>🔗 Trimite conversația pentru feedback</b>
  <p class="tip" style="margin:4px 0 6px">La finalul conversației, <b>scrie-i lui Claude concluzia ta</b>. Apoi apasă <b>Share → Create link</b> și pune linkul aici (începe cu <code>claude.ai/share/</code>). Claude o citește și îți dă feedback. <b>Lecția următoare se deschide după feedback</b> (și după mini-quiz).</p>
  <input id="fbl-${id}" type="url" style="width:100%;box-sizing:border-box;padding:8px" placeholder="https://claude.ai/share/…" value="${esc(f&&f.link||"")}">
  <div id="fbtw-${id}" style="display:${f&&f.text?'block':'none'};margin-top:8px"><p class="tip" style="margin:0 0 4px">Rezervă: scrie aici ce ai întrebat, ce ai primit, cum ai verificat și concluzia ta.</p><textarea id="fbt-${id}" rows="4" style="width:100%;box-sizing:border-box">${esc(f&&f.text||"")}</textarea></div>
  <div class="btns"><button class="btn primary" id="fbb-${id}" onclick="askFeedback('${id}')">${f&&f.reply?"Cere din nou feedback":"Cere feedback"}</button></div>
  <div id="fbr-${id}">${fbView(f)}</div></div>`;
}
async function askFeedback(id){
  const it=ITEMS.find(x=>x.l&&x.l.id===id); if(!it) return;
  const li=document.getElementById("fbl-"+id), tw=document.getElementById("fbtw-"+id), ta=document.getElementById("fbt-"+id), out=document.getElementById("fbr-"+id), b=document.getElementById("fbb-"+id);
  const link=li.value.trim(), text=tw.style.display!=="none"?ta.value.trim():"";
  const warn=m=>{ out.innerHTML=`<div class="tip">⚠️ ${m}</div>`; };
  if(!link&&text.length<40) return warn("Pune linkul de Share al conversației.");
  if(link&&/claude\.ai\/chat\//i.test(link)) return warn("Linkul ăsta e privat (claude.ai/chat/…). În conversație apasă <b>Share → Create link</b> și pune aici linkul care începe cu claude.ai/share/.");
  if(link&&!/claude\.ai\/share\/[0-9a-f-]{36}/i.test(link)) return warn("Linkul trebuie să înceapă cu https://claude.ai/share/");
  const sid=(link.match(/share\/([0-9a-f-]{36})/i)||[])[1];
  if(sid){ const other=Object.entries(state.fb||{}).find(([k,v])=>k!==id&&v.link&&v.link.toLowerCase().includes(sid.toLowerCase())); if(other) return warn("Linkul ăsta e deja folosit la altă provocare. Fiecare provocare are conversația ei."); }
  if(!AUTH||!authValid()){
    warn("Pentru feedback trebuie să fii logat cu Gmail-ul tău. Apasă pe butonul Google din meniu (sau din prezentare), apoi revino aici.");
    if(window.google&&google.accounts&&AUTH) google.accounts.id.prompt();
    return;
  }
  b.disabled=true; out.innerHTML=`<div class="tip">Claude citește conversația…</div>`;
  try{
    const r=await fetch(fbUrl(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:AUTH.token,link,text,challenge:it.l.challenge})});
    const j=await r.json();
    state.fb=state.fb||{};
    if(r.ok&&j.reply){ state.fb[id]={link,text,reply:j.reply,source:j.source,t:Date.now()}; save(); out.innerHTML=fbView(state.fb[id]); b.textContent="Cere din nou feedback"; finishLesson(ITEMS.indexOf(it)); }
    else if(j.unavailable){ state.fb[id]={link,text,skipped:j.error||"indisponibil",t:Date.now()}; save(); out.innerHTML=fbView(state.fb[id]); finishLesson(ITEMS.indexOf(it)); }
    else { if(j.needText) tw.style.display="block"; warn(esc(j.error||("Eroare "+r.status))+(j.needText?" Dacă nu reușești cu linkul, scrie mai jos ce ai făcut și concluzia ta.":"")); }
  }catch(e){ warn("Nu am putut contacta serverul. Verifică internetul și încearcă din nou."); }
  b.disabled=false;
}

/* îmbinare fără pierderi: ce e terminat pe oricare dispozitiv rămâne terminat */
function mergeStates(a,b){
  a=a||{}; b=b||{};
  const m=JSON.parse(JSON.stringify(a)), or=(x,y)=>{const o=Object.assign({},y||{}); for(const k in (x||{})) if(x[k]) o[k]=x[k]; return o;};
  m.done=or(a.done,b.done); m.unlock=or(a.unlock,b.unlock); m.introSeen=!!(a.introSeen||b.introSeen);
  m.codes=Object.assign({},b.codes||{},a.codes||{});
  const deep=(x,y)=>{const o=JSON.parse(JSON.stringify(y||{})); for(const k in (x||{})){ o[k]=Object.assign({},o[k]||{}); for(const j in x[k]) if(x[k][j]) o[k][j]=x[k][j]; } return o;};
  m.proofs=deep(a.proofs,b.proofs); m.check=deep(a.check,b.check); m.badgeLinks=deep(a.badgeLinks,b.badgeLinks);
  m.attempts=Object.assign({},b.attempts||{}); for(const k in (a.attempts||{})) m.attempts[k]=Math.max(a.attempts[k],m.attempts[k]||0);
  m.name=a.name||b.name||""; m.badgeOwner=a.badgeOwner||b.badgeOwner;
  m.quizOk=or(a.quizOk,b.quizOk);
  m.fb=Object.assign({},b.fb||{}); for(const k in (a.fb||{})){ const x=a.fb[k], y=m.fb[k]; if(!y||(x.reply&&!y.reply)||((!!x.reply===!!y.reply)&&(x.t||0)>(y.t||0))) m.fb[k]=x; }
  return m;
}
const sig=x=>JSON.stringify([x.done,x.unlock,x.introSeen,x.codes,x.proofs,x.check,x.badgeLinks,x.attempts,x.quizOk,x.fb]);
async function pullMerge(){
  const r=await syncCall("load");
  if(r.role==="viewer"){ await enterViewer(r); return "viewer"; }
  const merged=mergeStates(state,r.state);
  if(sig(merged)!==sig(state)){ merged.cur=state.cur; try{ localStorage.setItem(KEY,JSON.stringify(merged)); }catch(e){} await syncCall("save",{state:merged}); location.reload(); return true; }
  await syncCall("save",{state}); return false;
}
async function onGoogleCredential(resp){
  const p=jwtPayload(resp.credential); if(!p) return;
  const firstLogin=!AUTH;
  AUTH={token:resp.credential,email:p.email,exp:p.exp};
  try{ localStorage.setItem("curs-ai-auth",JSON.stringify(AUTH)); }catch(e){}
  setSync("saving");
  try{
    const pm=await pullMerge();
    if(pm==="viewer"){ setSync("viewer"); return; }
    if(pm) return;
    setSync("ok");
    if(firstLogin) go(state.cur||0);
  }catch(e){
    if(/acces/i.test(e.message)){ AUTH=null; try{localStorage.removeItem("curs-ai-auth");}catch(_){} alert("Contul ăsta nu are acces la curs. Loghează-te cu contul tău."); }
    setSync("err");
  }
  renderNav();
}

function initGoogle(){

let VIEWER=null;
async function enterViewer(r){
  VIEWER={student:r.student};
  save=function(){}; scheduleSync=function(){};
  state=Object.assign({done:{},cur:0,name:"",check:{},codes:{},unlock:{},proofs:{},attempts:{}},r.state||{});
  VIEWER.empty=!r.state;
  LEVELS.splice(1); FINAL=null; Object.keys(PROOFS).forEach(k=>{ if(k!=="1") delete PROOFS[k]; });
  for(const n of [2,3,4,5,6,7,8]){ if(!state.unlock[n]) break; try{ apply(n,await decrypt(LOCKED[n],state.unlock[n])); }catch(e){ break; } }
  renderIntro=renderParent;
  navIntro=i=>`<div class="lvl">👀 Mod părinte</div><button class="${i===state.cur?'active':''}" onclick="go(${i})"><span class="dot">📊</span><span>Panou progres<small>doar citire</small></span></button>`;
  nextBanner=function(){ const b=document.createElement("div"); b.className="next"; b.innerHTML=`<b>👀 Mod părinte:</b> vezi progresul lui ${esc(state.name||"Rareș")}, fără să poți modifica nimic. ${state.cur===0?'':'<button class="btn sm primary" onclick="go(0)">Panou progres</button>'}`; main.prepend(b); };
  accessible=function(){ return true; };
  buildItems(); state.cur=0; renderNav(); go(0);
}
function renderParent(){
  const who=esc(state.name||"Rareș");
  if(VIEWER&&VIEWER.empty){ main.innerHTML=`<h2>📊 Progresul lui ${who}</h2><div class="card">Încă nu există progres salvat în contul lui. Apare aici după ce se loghează cu Gmail-ul lui în aplicație.</div>`; return; }
  const last=state.updated?new Date(state.updated).toLocaleString("ro-RO",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):"—";
  const ns=nextStep();
  const totalAttempts=Object.values(state.attempts||{}).reduce((a,b)=>a+b,0);
  let h=`<div class="kicker">Mod părinte · doar citire</div><h2>📊 Progresul lui ${who}</h2>
  <div class="card"><ul style="margin:0">
    <li><b>Ultima activitate:</b> ${last}</li>
    <li><b>Unde e acum:</b> ${esc(ns.t.replace(/^Termină/,"Lucrează la").replace(/^Ia /,"Are de luat "))}</li>
    <li><b>💰 Câștigat (badge-uri confirmate):</b> ${earned()} lei</li>
    <li><b>Răspunsuri greșite la quiz-uri, în total:</b> ${totalAttempts}</li>
    ${state.badgeOwner?`<li><b>Numele de pe badge-uri:</b> ${esc(state.badgeOwner)}</li>`:""}
  </ul></div>
  <h3>Pe niveluri</h3>`;
  LEVELS.forEach(L=>{
    const d=L.lessons.filter(l=>state.done[l.id]).length, n=L.lessons.length, pct=Math.round(d/n*100);
    const proofs=L.short?"":` · Dovezi: ${proofsDone(L)?"✅ complete":"⬜ incomplete"}`;
    const badge=state.unlock[L.n+1]?`✅ confirmate (+${gsum(L)} lei)`:`⬜ neconfirmate (${gsum(L)} lei)`;
    h+=`<div class="card"><b>${esc(L.name)}</b><div class="bar" style="margin:8px 0;height:8px"><div style="width:${pct}%"></div></div>
      <div class="tip">Lecții: ${d}/${n}${proofs} · Badge-uri: ${badge}</div>`;
    const pv=(PROOFS[L.n]||[]).filter(p=>proofVal(L.n,p));
    if(pv.length) h+=`<details style="margin-top:8px"><summary>Dovezi (${pv.length})</summary><ul>`+pv.map(p=>`<li><b>${esc(p.t)}:</b> ${p.type==="code"||p.must?`<pre class="prompt" style="max-height:160px;overflow:auto">${esc(proofVal(L.n,p))}</pre>`:linkify(proofVal(L.n,p)).replace(/\n/g,"<br>")}</li>`).join("")+`</ul></details>`;
    const bl=(state.badgeLinks||{})[L.n]; if(bl&&Object.values(bl).some(Boolean)) h+=`<details style="margin-top:6px"><summary>Linkuri badge-uri</summary><ul>`+L.gate.filter(g=>bl[g[0]]).map(g=>`<li>${esc(g[1])}: ${linkify(bl[g[0]])}</li>`).join("")+`</ul></details>`;
    h+=`</div>`;
  });
  if(!FINAL) h+=`<div class="card tip">🔒 Nivelul următor: încă blocat. Se deschide după badge-urile nivelului curent.</div>`;
  else h+=`<div class="done-banner">🏁 A terminat tot traseul. Total: ${earned()} lei.</div>`;
  h+=`<div class="btns"><button class="btn primary" onclick="downloadReport()">⬇️ Descarcă raportul complet</button><button class="btn" onclick="logout()">Ieșire din cont</button></div>
  <p class="tip">Poți deschide orice lecție din meniu ca să vezi ce învață. În modul ăsta nu se salvează nimic.</p>`;
  main.innerHTML=h;
}

const PROOFS={

 ]

};

const isLink=s=>/^https?:\/\/\S+\.\S+/i.test((s||"").trim());
const isShare=s=>/^https:\/\/claude\.ai\/(share|public)\/\S+/i.test((s||"").trim());
const fromLink=p=>p.from&&state.fb&&state.fb[p.from]&&state.fb[p.from].link||"";
function proofVal(n,p){
  if(p.type==="code"){ return state.codes[p.lab]||""; }
  if(fromLink(p)) return fromLink(p);
  return ((state.proofs[n]||{})[p.k])||"";
}
function proofOk(n,p){
  const v=proofVal(n,p).trim();
  if(p.type==="link") return p.share?isShare(v):isLink(v);
  if(p.type==="links3") return v.split(/\s+/).filter(p.share?isShare:isLink).length>=3;
  if(p.type==="code"){ const lesson=ALL.find(l=>l.id===p.lab); const sample=lesson.play; return v.length>0 && v.trim()!==sample.trim(); }
  if(p.must && !v.includes(p.must)) return false;
  return v.length>=40;
}
const proofsDone=L=>PROOFS[L.n].every(p=>p.optional||proofOk(L.n,p));
function proofMsg(p){
  if(p.share) return p.type==="links3"?"Pune cel puțin 3 linkuri partajate de pe claude.ai (încep cu https://claude.ai/share/).":"Pune linkul partajat al conversației (începe cu https://claude.ai/share/). Vezi pașii de sus.";
  return {link:"Pune un link valid (începe cu https://).",links3:"Pune cel puțin 3 linkuri.",code:"Modifică întâi codul din laboratorul lecției.",text:p.must?`Trebuie să conțină „${p.must}” și cel puțin 40 de caractere.`:"Scrie cel puțin 40 de caractere."}[p.type];
}
function renderProof(i){
  const L=ITEMS[i].L, n=L.n;
  let h=`<div class="kicker">${L.name}</div><h2>📎 Dovezile tale</h2><p>Ca să deblochezi diploma, arată ce ai făcut. Dovezile marcate „opțional” nu sunt necesare pentru diplomă.</p>
  <div class="card paid"><b>🔗 Important: linkurile de conversație trebuie să fie PARTAJATE</b>
    <p style="margin:6px 0">Altfel nimeni în afară de tine nu le poate deschide, iar ${PARENT} nu le poate verifica. Pentru fiecare conversație:</p>
    <ol style="margin:0">
      <li>Deschide conversația pe claude.ai.</li>
      <li>Apasă butonul <b>Share</b> (sus, în dreapta).</li>
      <li>Creează linkul public și apasă <b>Copy link</b>.</li>
      <li>Lipește-l aici. Trebuie să înceapă cu <code>https://claude.ai/share/</code>.</li>
    </ol>
    <p class="tip" style="margin:6px 0 0">Nu partaja conversații cu date personale (parole, adrese, informații despre alți oameni).</p>
  </div>`;
  PROOFS[n].forEach(p=>{
    const v=proofVal(n,p), ok=proofOk(n,p);
    h+=`<div class="card"><b>${ok?'✅':'⬜'} ${p.t}</b>${p.optional?' <span class="tip">(opțional)</span>':''}<div class="tip">${p.h}</div>`;
    if(p.type==="code") h+=`<div class="prompt" style="max-height:140px;overflow:auto">${v?esc(v.slice(0,600))+(v.length>600?'…':''):'(laboratorul e gol)'}</div>`;
    else if(fromLink(p)) h+=`<p style="margin:6px 0 0">✓ Preluat automat de la provocarea din lecție: ${linkify(v)}</p>`;
    else if(p.type==="link") h+=`${p.from?'<div class="tip">Se completează singur când trimiți linkul la provocarea din lecție. Îl poți pune și aici.</div>':''}<input class="pin" data-k="${p.k}" value="${esc(v)}" placeholder="${p.share?'https://claude.ai/share/...':'https://...'}">`;
    else h+=`<textarea class="pin" data-k="${p.k}" rows="${p.type==='links3'?3:4}" placeholder="${p.type==='links3'?'un link pe rând':''}">${esc(v)}</textarea>`;
    h+=`<div class="fb pmsg">${ok||(p.optional&&!proofVal(n,p))?'':'<span class="bad-t">'+proofMsg(p)+'</span>'}</div></div>`;
  });
  h+=`<div class="btns"><button class="btn primary" onclick="downloadReport()">⬇️ Descarcă raportul pentru ${PARENT}</button></div>`;
  h+=`<div class="footer-nav"><button class="btn" onclick="go(${i-1})">← Înapoi</button><button class="btn primary" onclick="go(${i+1})">Spre diplomă 🎓</button></div>`;
  main.innerHTML=h;
  main.querySelectorAll(".pin").forEach(el=>el.addEventListener("input",()=>{
    (state.proofs[n]=state.proofs[n]||{})[el.dataset.k]=el.value; save();
    const p=PROOFS[n].find(x=>x.k===el.dataset.k), ok=proofOk(n,p), card=el.closest(".card");
    card.querySelector("b").textContent=(ok?'✅ ':'⬜ ')+p.t;
    card.querySelector(".pmsg").innerHTML=ok||(p.optional&&!el.value.trim())?'':'<span class="bad-t">'+proofMsg(p)+'</span>';
    renderNav();
  }));
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function linkify(s){ return esc(s).replace(/https?:\/\/[^\s&<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }

    });
    const fbl=L.lessons.filter(l=>l.challenge);

    const ll=L.lessons.find(l=>l.checklist);
    if(ll){ const c=state.check[ll.id]||{}; h+=`<h3>Lista de verificare: ${esc(ll.title)}</h3><ul>`+ll.checklist.map((t,k)=>`<li>${c[k]?'☑':'☐'} ${esc(t)}</li>`).join("")+`</ul>`; }
  });
  h+=`<h2>Badge-uri și recompense</h2><ul>`+LEVELS.map(L=>`<li>${state.unlock[L.n+1]?'✅':'⬜'} ${esc(L.name)}: ${esc(L.gate.map(g=>g[1]+' ('+g[2]+' lei)').join(', '))}</li>`).join('')+`</ul><p>Total confirmat: <b>${earned()} lei</b></p>`;
  h+=`<h2>Întrebări de pus la discuție</h2><ul><li>Arată-mi o conversație și spune-mi ce ai schimbat după primul răspuns.</li><li>Explică-mi cum salvează aplicația ta datele.</li><li>Fă acum, în fața mea, o mică modificare în proiect (o culoare, un câmp nou).</li></ul></body></html>`;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));
  a.download=`raport-curs-ai-${(state.name||'rares').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-')}.html`;
  document.body.appendChild(a); a.click(); a.remove();
}

const answered={};
/* variantele apar amestecate; după o greșeală întrebarea se blochează (15 s, apoi 30 s) și se amestecă din nou */
function shuffled(n){ const a=[...Array(n).keys()]; for(let k=n-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; }
function optsHTML(i,qi){
  const q=ITEMS[i].l.quiz[qi];
  return shuffled(q.o.length).map(oi=>`<button class="opt" onclick="answer(${i},${qi},${oi},this)">${q.o[oi]}</button>`).join("");
}
const coolKey=(l,qi)=>l.id+":"+qi;
function startCooldown(i,qi){
  const l=ITEMS[i].l, k=coolKey(l,qi); state.cool=state.cool||{};
  const c=state.cool[k]||{n:0}; c.n++; c.until=Date.now()+(c.n>=2?30000:15000); state.cool[k]=c; save();
  runCooldown(i,qi);
}
function runCooldown(i,qi){
  const l=ITEMS[i].l, c=(state.cool||{})[coolKey(l,qi)], box=document.getElementById("q-"+qi); if(!c||!box) return;
  const fb=box.querySelector(".fb"), tick=()=>{
    if(!document.body.contains(box)||ITEMS[state.cur].l!==l) return;
    const left=Math.ceil((c.until-Date.now())/1000);
    if(left>0){ box.querySelectorAll(".opt").forEach(b=>b.disabled=true); fb.innerHTML=`<span class="bad-t">Nu chiar.</span> Recitește întrebarea. Poți răspunde din nou în ${left} s.`; setTimeout(tick,1000); }
    else { box.querySelector(".opts").innerHTML=optsHTML(i,qi); fb.innerHTML=`Variantele s-au amestecat. Gândește-te și alege.`; }
  };
  tick();
}
function answer(i,qi,oi,el){
  const l=ITEMS[i].l, q=l.quiz[qi], box=el.closest(".q"), fb=box.querySelector(".fb");
  const c=(state.cool||{})[coolKey(l,qi)]; if(c&&c.until>Date.now()&&!state.done[l.id]) return;
  box.querySelectorAll(".opt").forEach(b=>b.classList.remove("wrong"));
  if(oi===q.a){ el.classList.add("right"); box.querySelectorAll(".opt").forEach(b=>{ if(b!==el) b.disabled=true; }); fb.innerHTML=`<span class="good-t">Corect!</span> ${q.e}`; (answered[i]=answered[i]||{})[qi]=true; }
  else { el.classList.add("wrong"); if(!state.done[l.id]){ state.attempts[l.id]=(state.attempts[l.id]||0)+1; startCooldown(i,qi); } else fb.innerHTML=`<span class="bad-t">Nu chiar.</span> Mai încearcă.`; }
  if(l.quiz.every((_,k)=>answered[i]&&answered[i][k]) && !state.done[l.id]){
    state.quizOk=state.quizOk||{}; if(!state.quizOk[l.id]){ state.quizOk[l.id]=true; save(); }
    finishLesson(i);
  }
}
/* lecția e gata când quiz-ul e corect și, la provocări, când a primit feedback */
function finishLesson(i){

  if(l.challenge&&!fbDone(l.id)){ if(nh) nh.textContent="🔒 Quiz corect. Mai ai de cerut feedback la provocare (sus) ca să treci mai departe."; return; }

}

/* ---------- BADGE-URI ȘI DEBLOCARE ---------- */
const normCode=c=>String(c).toUpperCase().replace(/[^A-Z0-9]/g,"");
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function gsum(L){ return L.gate.reduce((a,g)=>a+g[2],0); }
function earned(){ return LEVELS.filter(L=>state.unlock[L.n+1]).reduce((s,L)=>s+gsum(L),0)+(FINAL&&FINAL.bonus||0); }
async function decrypt(blob,code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(normCode(code)),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(blob.s),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(blob.i)},key,unb64(blob.c));
  return new TextDecoder().decode(pt);
}
function apply(n,src){
  const r=(new Function(src))();
  if(r.final){ FINAL=r; return; }
  if(LEVELS.some(L=>L.n===r.level.n)) return;
  LEVELS.push(r.level); PROOFS[r.level.n]=r.proofs;
}
async function unlock(n,code){
  const src=await decrypt(LOCKED[n],code); // aruncă eroare dacă e greșit
  apply(n,src); state.unlock[n]=normCode(code); save(); buildItems();
}
function renderGate(i){
  const L=ITEMS[i].L, next=L.n+1, ok=!!state.unlock[next], sum=gsum(L);
  let h=`<div class="kicker">${L.name} · Pasul pe Claude Academy</div><h2>🏅 Badge-urile oficiale</h2>`;
  h+=`<p>Acum treci la cursul oficial, în engleză. Temele le știi deja din nivelul ăsta. Lângă fiecare curs e trecută suma pe care o primești de la ${PARENT} pentru badge.</p>`;
  h+=glossaryHTML(L);
  h+=`<div class="card"><b>Cursuri:</b><ul>`+L.gate.map(g=>`<li><a href="${AC(g[0])}" target="_blank" rel="noopener">${g[1]} ↗</a> · ${g[2]} lei</li>`).join("")+`</ul></div>`;
  h+=`<div class="card"><b>Pas cu pas, pentru fiecare curs:</b><ol>
    <li>Ai nevoie de contul tău <b>Claude</b> (același cu care intri pe claude.ai).</li>
    <li>Apasă pe linkul cursului de mai sus. Se deschide pe <b>academy.claude.com</b>.</li>
    <li>Apasă <b>„Sign in”</b> (dreapta sus) și intră cu contul Claude. Fără asta, quiz-ul și badge-ul nu se salvează.</li>
    <li>Apasă <b>„Start course”</b> și parcurge lecțiile în ordine, din cuprinsul din dreapta.</li>
    <li>La final dai <b>„Course quiz”</b>. Rezultatul se salvează în contul tău.</li>
    <li>Deschide pagina <b>„Completion badge”</b>: acolo e badge-ul tău.</li>
    <li>Pe pagina badge-ului, la opțiunile de share, copiază <b>linkul de verificare</b> (începe cu academy.claude.com/verify/).</li>
    <li>Când ai badge-urile pentru toate cursurile de aici, lipește linkurile mai jos și apasă <b>„Verifică badge-urile”</b>. Se deblochează singur ${next<LAST?'nivelul următor':'finalul'}, iar banii apar în contor.</li>
    <li>Dacă verificarea automată nu merge, îi arăți lui ${PARENT} badge-urile și îți dă el un cod.</li>
  </ol><p class="tip">Cursurile sunt în engleză. În Chrome poți da click dreapta pe pagină → „Tradu în română”. Temele le știi deja din aplicație.</p></div>`;
  if(ok) h+=`<div class="done-banner">✅ Badge-uri confirmate: +${sum} lei. ${next<LAST?'Nivelul următor e deblocat.':'Ai deblocat finalul!'}</div><div class="btns"><button class="btn primary" onclick="go(${i+1})">Mergi mai departe →</button></div>`;
  else h+=gateAutoHTML(L,next)+`<div class="card"><b>Codul de la ${PARENT}</b><input class="pin" id="ucode" placeholder="ex: ABCD-1234" autocomplete="off"><div class="btns"><button class="btn primary" id="ubtn" onclick="tryUnlock(${i},${next})">Deblochează 🔓</button></div><div class="fb" id="umsg"></div></div>`;
  main.innerHTML=h; bindGateAuto(i,L,next);
  const inp=document.getElementById("ucode"); if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock(i,next); });
}
async function tryUnlock(i,n){
  const code=document.getElementById("ucode").value, msg=document.getElementById("umsg"), btn=document.getElementById("ubtn");
  if(!normCode(code)){ msg.innerHTML='<span class="bad-t">Scrie codul primit.</span>'; return; }
  if(!(window.crypto&&crypto.subtle)){ msg.innerHTML='<span class="bad-t">Browserul ăsta nu poate verifica codul. Deschide fișierul în Chrome, Edge sau Firefox.</span>'; return; }
  btn.disabled=true; msg.textContent="Se verifică…";
  try{ await unlock(n,code); renderNav(); go(ITEMS.findIndex(x=>x.type==="gate"&&x.L.n===n-1)); }
  catch(e){ btn.disabled=false; msg.innerHTML='<span class="bad-t">Cod greșit. Verifică-l cu '+PARENT+'.</span>'; }
}
function renderLocked(){
  main.innerHTML=`<h2>🔒 Nivel ascuns</h2><p>Ce urmează se vede doar după ce iei badge-urile de la pasul „Badge-uri Academy” și primești codul de la ${PARENT}.</p><p class="tip">Până atunci, nici din codul aplicației nu se poate citi: conținutul e criptat.</p>`;
}
function renderFinal(){
  main.innerHTML=FINAL.html+`<div class="done-banner">💰 Total câștigat: ${earned()} lei</div><div class="btns"><button class="btn primary" onclick="downloadReport()">⬇️ Raportul final pentru ${PARENT}</button></div>`;
}

(async()=>{
  for(const n of [2,3,4,5,6,7,8]){
    if(!state.unlock[n]) break;
    try{ apply(n,await decrypt(LOCKED[n],state.unlock[n])); }catch(e){ delete state.unlock[n]; break; }
  }
  buildItems(); go(state.cur||0); initGoogle(); syncOnStart();
})();

</script>
